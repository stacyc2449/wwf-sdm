absence_gen:
  rscript: "C:\\Program Files\\R\\R-4.4.1\\bin\\Rscript.exe" # installation of R is required; paste the path of Rscript after installation
  pseudo_absence_path: "pseudo_absence.R"  # relative path
  spatial_thin_distance_km: 5

current_climate:
# order: bio02, bio04, bio06, bio14, bio15, bio19, fgd, scd
  vars: ["bio02", "bio04", "bio06", "bio14", "bio15", "bio19", "fgd", "scd"]
  bioclim_path: "inputs/chelsa_clim/current/*.tif"
  trimmed_path: "inputs/chelsa_clim/trim_curr"


future_climate:
  select_year: "2070"
  downscale: 0.25

  boundary:
    min_lon: -170
    max_lon: -52
    min_lat: 24
    max_lat: 83.5

  year_2040:
    ssp126:
      path: "inputs/chelsa_clim/future/126/*.tif"
      trimmed_path: "inputs/chelsa_clim/trim_126"
    ssp370:
      path: "inputs/chelsa_clim/future/370/*.tif"
      trimmed_path: "inputs/chelsa_clim/trim_370"
    ssp585:
      path: "inputs/chelsa_clim/future/585/*.tif"
      trimmed_path: "inputs/chelsa_clim/trim_585"

  year_2070:
